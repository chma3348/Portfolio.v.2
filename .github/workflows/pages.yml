# Publishes the site to GitHub Pages (chrisinthewild.com) on every push to
# main. Only the site's own files go up — the page, its scripts and styles,
# and the photos — so the README, notes and dev server stay in the repo.
# Settings → Pages must have its Source set to "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gather the site's own files
        run: |
          mkdir _site
          cp index.html styles.css game.js photos.js runner.js ski.js alps.js _site/
          cp -r photos _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
